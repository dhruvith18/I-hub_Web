<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>

    <link rel="stylesheet" href="style.css">

    <style>
        body {
            padding: 30px;
            background: #0f172a;
            color: white;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .tabs {
            display: flex;
            gap: 15px;
        }

        .tab-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: #1e293b;
            color: white;
        }

        .tab-btn.active {
            background: #0138cf;
        }

        .logout-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: crimson;
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(255,255,255,0.05);
        }

        th, td {
            border: 1px solid rgba(255,255,255,0.1);
            padding: 12px;
            text-align: left;
        }

        th {
            background: #0138cf;
        }

        canvas {
            background: white;
            border-radius: 10px;
            padding: 20px;
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

    <div class="header">

        <div class="tabs">
            <button class="tab-btn active" data-tab="main">
                Main
            </button>

            <button class="tab-btn" data-tab="graphs">
                Graphs
            </button>
        </div>

        <button class="logout-btn" id="logoutBtn">
            Logout
        </button>

    </div>

    <div id="main" class="tab-content active">
        
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone No.</th>
                    <th>Visitors</th>
                    <th>Message</th>
                    <th>Date</th>
                </tr>
            </thead>

            <tbody id="feedbackTable">
            </tbody>
        </table>

    </div>

    <div id="graphs" class="tab-content">

        <canvas id="visitorsChart"></canvas>

    </div>

    <script type="module" src="admin-dashboard.js"></script>

</body>

</html>
