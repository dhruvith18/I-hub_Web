<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Innovation Hub</title>

    <link rel="stylesheet" href="style.css">

    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0f172a;
        }

        .login-card {
            width: 400px;
            max-width: 90%;
            padding: 35px;
            border-radius: 20px;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.15);
        }

        .login-card h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        .login-card input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border-radius: 10px;
            border: none;
            outline: none;
        }

        .login-card button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: #0138cf;
            color: white;
            font-weight: bold;
        }

        #error {
            color: #ff6b6b;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="login-card">
        <h1>Admin Login</h1>

        <input type="email" id="email" placeholder="Admin Email">

        <input type="password" id="password" placeholder="Password">

        <button id="loginBtn">
            Login
        </button>

        <p id="error"></p>
    </div>

    <script type="module" src="admin-login.js"></script>

</body>

</html>
